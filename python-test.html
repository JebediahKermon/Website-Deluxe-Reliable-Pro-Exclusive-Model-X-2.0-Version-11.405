<!DOCTYPE html>
<html>
  <head>
    <title>Python in the Browser</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  </head>
  <body>
    <h1>Python Calculator</h1>

    <input type="text" id="num1" placeholder="First number">
    <input type="text" id="num2" placeholder="Second number">
    <button id="add-btn">Add them</button>

    <p id="result">The answer will appear here.</p>

    <script type="py">
      from pyscript import document, when

      @when("click", "#add-btn")
      def add_numbers(event):
          a = float(document.querySelector("#num1").value)
          b = float(document.querySelector("#num2").value)
          document.querySelector("#result").innerText = f"The answer is {a + b}"
    </script>
  </body>
</html>
